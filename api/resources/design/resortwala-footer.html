<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResortWala Social Media Footer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --footer-height: 100px;
            --padding-x: 40px;
            --icon-size: 22px;
            --brand-color: #0F172A;
            /* Navy */
            --tagline-color: #64748B;
            --bg-color: #FFFFFF;
            --text-color: #1E293B;
        }

        body {
            margin: 0;
            padding: 50px;
            background-color: #F1F5F9;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .footer-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* The Reusable Footer Component */
        .rw-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--footer-height);
            padding: 0 var(--padding-x);
            box-sizing: border-box;
            background: var(--bg-color);
            border-radius: 4px;
            /* Subtle rounding or sharp as per preference */
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Light Mode */
        .rw-footer.light {
            --bg-color: #FFFFFF;
            --text-color: #0F172A;
            --brand-color: #0F172A;
            --tagline-color: #64748B;
        }

        /* Dark Mode */
        .rw-footer.dark {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --brand-color: #FFFFFF;
            --tagline-color: #94A3B8;
        }

        /* Brand Section */
        .footer-brand {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: flex-start;
        }

        .brand-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--brand-color);
            margin: 0;
            text-decoration: none;
        }

        /* Tagline Section */
        .footer-tagline {
            display: flex;
            justify-content: center;
            flex: 1.5;
            text-align: center;
        }

        .tagline-text {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--tagline-color);
        }

        /* Action Section */
        .footer-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 24px;
            flex: 1;
        }

        .website-link {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            margin-right: 8px;
        }

        .social-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--icon-size);
            height: var(--icon-size);
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-link:hover {
            opacity: 0.7;
        }

        .social-link svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* Label styling (optional, Hidden in basic icons but structured) */
        .social-label {
            display: none;
            /* Keep clean as per minimal rule */
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
            text-transform: uppercase;
        }

        /* Responsive Safe Areas */
        @media (max-width: 900px) {
            .rw-footer {
                flex-direction: column;
                height: auto;
                padding: 24px 20px;
                gap: 16px;
            }

            .footer-brand,
            .footer-tagline,
            .footer-actions {
                justify-content: center;
                text-align: center;
            }

            .brand-text {
                font-size: 24px;
            }

            .tagline-text {
                font-size: 12px;
            }
        }
    </style>
</head>
